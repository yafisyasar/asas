<html>
<head><title>bgcolor</title></head>
<body>
<button onclick="change('lightblue')">BLUE</button>
<button onclick="change('lightgreen')">GREEN</button>
<button onclick="change('yellow')">YELLOW</button>
<button onclick="change('white')">RESET</button>
<script>
function change(c)
{
document.body.style.backgroundColor=c;
}
</script>
</body>
</html>
