<!DOCTYPE html>
<html>
<head>
<title></title>
<script>
function jsOperators(){
let a = 10, b = 3;
document.write("<br>Arithmetic Opeators:<br>");
document.write("a + b =" + (a + b) + "<br> ");
document.write("a - b =" + (a - b) + "<br> ");
document.write("a * b =" + (a * b) + "<br> ");
document.write("a / b =" + (a / b) + "<br> ");
document.write("a % b =" + (a % b) + "<br> ");
document.write("a ** b (power) =" + (a ** b) + "<br> ");
}
</script>
</head>
<body>
<button onclick="jsOperators()">Click to see JS operators</button>
</body>
</html>
