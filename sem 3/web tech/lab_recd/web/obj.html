<html><head><title>obj</title></head>
<body>
<script>
let a=
{
marks:90,
age:18,
name:"Rahul",
height:167
};

console.log(a.marks);
console.log(a["marks"]);
console.log(a.height);

let p=new Object();
p.name="rahul";
p.age=18;
p.gender="female";
console.log(p.name+" "+p.age+" "+p.gender);
</script>
</body>
</html>
