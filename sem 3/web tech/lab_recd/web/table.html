<html>
<head><title>mult table</title></head>
<body>
<script>
function mult(a)
{ var i;
document.write("<b>multiplication table of</b> "+a+":"+"<br>");
 for(i=1;i<=10;i++)
 {
 document.write(a+" X "+i+"="+a*i+"<br>");
 }
}
let n=parseInt(prompt("Enter a no:"));
mult(n);
</script>
</body>
</html>
