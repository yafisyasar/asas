<!DOCTYPE html>
<html>
<head>
<title>Rollover Menu</title>

<style>
body{
    font-family: Arial;
}

nav{
    background: #333;
    padding:10px;
}

nav a{
    color:white;
    margin:10px;
    text-decoration:none;
}

.submenu{
    display:none;
    list-style:none;
    padding:5px;
    background:#555;
}
</style>

</head>

<body>

<h2>Rollover Menu Using JavaScript</h2>

<nav>

<div class="menu-item">
<a href="#">Home</a>
</div>

<div class="menu-item">
<a href="#">About</a>
<ul class="submenu">
<li><a href="#">Team</a></li>
<li><a href="#">History</a></li>
</ul>
</div>

<div class="menu-item">
<a href="#">Services</a>
<ul class="submenu">
<li><a href="#">Consulting</a></li>
<li><a href="#">Development</a></li>
</ul>
</div>

<div class="menu-item">
<a href="#">Contact</a>
</div>

</nav>

<script>

let items = document.querySelectorAll(".menu-item");

items.forEach(function(item){

    item.onmouseover = function(){
        let submenu = item.querySelector(".submenu");
        if(submenu){
            submenu.style.display = "block";
        }
    }

    item.onmouseout = function(){
        let submenu = item.querySelector(".submenu");
        if(submenu){
            submenu.style.display = "none";
        }
    }

});

</script>

</body>
</html>
