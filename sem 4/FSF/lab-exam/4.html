<!DOCTYPE html>
<html>
<head>
<title>Simple Calculator</title>
</head>

<body>

<h2>Simple Calculator</h2>

<input type="number" id="n1" placeholder="First number">
<input type="number" id="n2" placeholder="Second number">

<br><br>

<button onclick="calc('+')">+</button>
<button onclick="calc('-')">-</button>
<button onclick="calc('*')">*</button>
<button onclick="calc('/')">/</button>

<p id="result"></p>

<script>
function calc(op){
let a = parseFloat(document.getElementById("n1").value);
let b = parseFloat(document.getElementById("n2").value);
let r;

if(op=='+') r=a+b;
else if(op=='-') r=a-b;
else if(op=='*') r=a*b;
else if(op=='/') r=a/b;

document.getElementById("result").innerHTML="Result: "+r;
}
</script>

</body>
</html>
